        .controls {

<body>
    <h1>useEffect &amp; State 연습문제 5선</h1>
    <p class="description">오늘 배운 useEffect(의존성 배열, cleanup, 마운트/언마운트)와 state 관리를 활용해 TODO를 완성하세요. 콘솔(F12)을 열어두고 확인하는 문제가
        많습니다.</p>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 문제 1. 마운트 시 한 번만 인사하기
        function WelcomeMessage() {
            // TODO 1: 컴포넌트가 처음 화면에 나타날 때(Mount) 딱 한 번만
            // console.log('컴포넌트가 마운트되었습니다')를 실행하는 useEffect를 작성하세요.
            // 힌트: 의존성 배열을 어떻게 주면 '한 번만' 실행될까요?
            useEffect(() => {
                console.log('컴포넌트가 마운트되었습니다.');
            }, []);

            return (
                <section className="problem">
                    <h2>문제 1. 마운트 시 한 번만 인사하기</h2>
                    <ul className="requirements">
                        <li>컴포넌트가 처음 화면에 나타날 때 콘솔에 <code>'컴포넌트가 마운트되었습니다'</code>를 한 번만 출력합니다.</li>
                        <li>이후 리렌더링이 일어나도 다시 출력되면 안 됩니다.</li>
                    </ul>
                    <div className="result">콘솔을 확인하세요 (F12)</div>
                </section>
            );
        }

        // 문제 2. 클릭 횟수에 따라 탭 제목 바꾸기
        function TitleUpdater() {
            const [count, setCount] = useState(0);

            // TODO 2: count가 바뀔 때마다 document.title을
            // `클릭 ${count}회` 형태로 바꾸는 useEffect를 작성하세요.
            // 힌트: 의존성 배열에 무엇을 넣어야 count가 바뀔 때만 실행될까요?
            useEffect(() => {
                const $title = document.querySelector('title');

                $title.textContent = `클릭 ${count}회`;

            }, [count]);

            return (
                <section className="problem">
                    <h2>문제 2. 클릭 횟수에 따라 탭 제목 바꾸기</h2>
                    <ul className="requirements">
                        <li><code>count</code> state를 0으로 시작합니다.</li>
                        <li>버튼을 누르면 count가 1 증가합니다.</li>
                        <li>count가 바뀔 때마다 브라우저 탭 제목(<code>document.title</code>)이 "클릭 3회"처럼 바뀝니다.</li>
                        <li>탭 제목은 count가 실제로 바뀔 때만 갱신되어야 합니다. (다른 이유로 리렌더링될 땐 갱신 X)</li>
                    </ul>
                    <div className="controls">
                        <button onClick={() => setCount(count + 1)}>클릭 (현재 {count}회)</button>
                    </div>
                    <div className="result">브라우저 탭 제목을 확인하세요</div>
                </section>
            );
        }

        // 문제 3. 스톱워치 (타이머 + cleanup)
        function StopWatch() {
            const [seconds, setSeconds] = useState(0);
            const [isRunning, setIsRunning] = useState(false);

            // TODO 3: isRunning이 true일 때만 1초마다 seconds를 1씩 증가시키는
            // setInterval을 등록하는 useEffect를 작성하세요.
            // - isRunning이 false로 바뀌거나 컴포넌트가 사라질 때는
            //   반드시 clearInterval로 타이머를 정리(cleanup)해야 합니다.
            // - 의존성 배열에 무엇이 들어가야 isRunning이 바뀔 때마다
            //   이전 타이머를 정리하고 새로 판단할 수 있을지 생각해보세요.

            const handleReset = () => {
                setIsRunning(false);
                setSeconds(0);
            };

            useEffect(() => {
                if (!isRunning) return;
                
                const timerId=setInterval(() => {
                    setSeconds((prev) => prev + 1)
                },1000);
                
                return () => {
                    clearInterval(timerId);
                }
            }, [isRunning]);

            return (
                <section className="problem">
                    <h2>문제 3. 스톱워치</h2>
                    <ul className="requirements">
                        <li><code>seconds</code>(경과 초), <code>isRunning</code>(실행 여부) state를 관리합니다.</li>
                        <li>시작 버튼을 누르면 1초마다 seconds가 1씩 증가합니다.</li>
                        <li>정지 버튼을 누르면 더 이상 증가하지 않습니다. (타이머가 실제로 멈춰야 함, 백그라운드에서 계속 도는 건 X)</li>
                        <li>초기화 버튼을 누르면 정지하고 seconds를 0으로 되돌립니다.</li>
                    </ul>
                    <h3>{seconds}초</h3>
                    <div className="controls">
                        <button onClick={() => setIsRunning(true)}>시작</button>
                        <button className="secondary" onClick={() => setIsRunning(false)}>정지</button>
                        <button className="secondary" onClick={handleReset}>초기화</button>
                    </div>
                </section>
            );
        }

        // 문제 4. 온라인/오프라인 상태 감지 (이벤트 리스너 등록/해제)
        function NetworkStatus() {
            // TODO 4-1: isOnline boolean state를 navigator.onLine의 현재 값으로 초기화하세요.

            // TODO 4-2: 컴포넌트가 마운트될 때 'online', 'offline' 이벤트를 window에 등록해서
            // 각각 isOnline을 true/false로 바꾸는 useEffect를 작성하세요.
            // - 컴포넌트가 사라질 때는 등록했던 리스너를 반드시 해제(cleanup)하세요.
            // 힌트: window.addEventListener('online', handler), window.removeEventListener(...)

            return (
                <section className="problem">
                    <h2>문제 4. 온라인/오프라인 상태 감지</h2>
                    <ul className="requirements">
                        <li><code>isOnline</code> state를 현재 네트워크 상태로 초기화합니다.</li>
                        <li>네트워크 연결이 끊기거나 복구되면 자동으로 state가 갱신됩니다. (개발자 도구 Network 탭에서 Offline 체크해보며 테스트)</li>
                        <li>컴포넌트가 사라질 때는 등록한 이벤트 리스너를 정리합니다.</li>
                    </ul>
                    <div className="result">상태: 온라인 / 오프라인 표시 (TODO)</div>
                </section>
            );
        }

        // 문제 5. 즐겨찾기 목록 + 개수를 탭 제목에 반영 (CRUD + useEffect 조합)
        function FavoritesList() {
            const [favorites, setFavorites] = useState([
                { id: 1, name: '리액트 공식 문서' },
                { id: 2, name: 'MDN' },
            ]);
            const [inputValue, setInputValue] = useState('');

            // TODO 5-1: handleAdd를 완성하세요.
            // - inputValue가 빈 문자열이면 추가하지 않습니다.
            // - { id: Date.now(), name: inputValue } 형태로 favorites에 추가합니다. (불변성 유지)
            // - 추가 후 inputValue를 초기화합니다.
            const handleAdd = () => {

            };

            // TODO 5-2: handleRemove를 완성하세요. (filter 사용)
            const handleRemove = (id) => {

            };

            // TODO 5-3: favorites.length가 바뀔 때마다
            // document.title을 `즐겨찾기 ${favorites.length}개`로 갱신하는
            // useEffect를 작성하세요.

            return (
                <section className="problem">
                    <h2>문제 5. 즐겨찾기 목록 관리</h2>
                    <ul className="requirements">
                        <li><code>favorites</code> 배열 state(초기값 2개)와 입력값 state를 관리합니다.</li>
                        <li>입력 후 추가 버튼을 누르면 목록에 새 항목이 생깁니다. (빈 값은 무시)</li>
                        <li>각 항목의 삭제 버튼을 누르면 해당 항목만 제거됩니다.</li>
                        <li>목록 개수가 바뀔 때마다 브라우저 탭 제목이 "즐겨찾기 3개"처럼 갱신됩니다.</li>
                    </ul>
                    <div className="controls">

                            </div>

                    </div>

        }

        function App() {
            return (
                <main className="app">
                    <WelcomeMessage />
                    <TitleUpdater />
                    <StopWatch />
                    <NetworkStatus />
                    <FavoritesList />
                </main>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
