<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>콘솔을 확인하세요</h1>
    <script> function increase(number) {
            const promise = new Promise ((resolve, reject) => {
                setTimeout(() => {
                    const result = number + 10;

                    if(result > 30) {
                        const e = new Error('숫자가너무큽니다')
                        return reject(e)
                    }
                    resolve(result); //.then 매개변수로 전달된다
                },1000)

            })
            return promise;
         }
         
         //함수 앞에 'asnyc'를 붙여야 내부에서 'await'를 사용할수 있다.
         async function run () {
            console.log('작업시작....')
            //
            try{let result = await increase(0)
            console.log(result);
            
            result = await increase(result);
            console.log(result)

            result = await increase(result);
            console.log(result)
            
            result = await increase(result);
            console.log(result)
            
            result = await increase(result);
            console.log(result)

            } catch (error) {
                //try 블럭 안에서 promise가 reject 되면 catch블럭이 실행된다
                console.error(error);
            }
            console.log('작업완료!!')
            
            //await : increase(0) promise가 끝날 때까지 기다려다가
            //resolve된 결과값을 result변수에 할당한다.
         }

         run();

         </script>
</body>
</html>
