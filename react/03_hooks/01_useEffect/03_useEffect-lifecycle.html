<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const {useState, useEffect} =React;
        
        function Counter() {

            const [count,setCount] = useState(0);
            const [otherCount, setOtherCount] = useState(0);

            //일단 첫 마운트 시점에 한번동작

            //1.의존성배열생략
            useEffect(() => {
                console.log('렌더링 될 떄마다 실행')
            })

            //2.빈의존성배열[]
            useEffect(() => {
                console.log('컴포넌트가 처음 화면에 나타남(mount)')
            },[])

            //3. 의존성 배열에 특정값 지정 : 해당 값이 변경될때만 실행
            useEffect(() => {
                console.log(`count값이 ${count}로 변경되어, 이 useEffect가 실행`)
            },[count])

            console.log('Counter 컴포넌트 렌더링')

            return (
                <>
                    <h2>단순 카운터</h2>
                    <p>{count}번 클릭 했습니다</p>
                    <button onClick = {() => setCount(count +1)}>클릭</button>
                    <p>other count: {otherCount}</p>
                    <button onClick={()=> setOtherCount(otherCount+1)}>
                        +1</button>
                </>
            )
        }

        function Timer () {
            useEffect(() => {
                console.log('타이머가 시작되었습니다(mount).')

                const timerId = setInterval(()=>{
                    console.log('..1초 경과...')
                },1000)

                //Cleanup 함수: useEffect가 반환하는 함수
                //컴포넌트가 화면에서 사라지기 직전(Unmount)에 호출
                //의존성이 바뀌어 재실행되는 경우 이전 작업을 정리 새값으로 작업시작
                return () => {
                    console.log('타이머를 정리합니다 (Unmount)')
                    clearInterval(timerId); //생성했던 타이머 제거
                }

            },[])
            return (
                <h3>타이머가 동작중(콘솔확인)</h3>
            )

        }

        function App() {
            const [showTimer, setShowTimer] = useState(true);
            return (
                <>
                 <Counter/>
                 <hr/>
                 <button onClick= {() => setShowTimer(!showTimer)}>타이머 보이기/숨기기</button>
                 {showTimer && <Timer/>}
                </>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
    </script>
    
</body>
</html>
