<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>node-traversal</title>
</head>
<body>
    <h1>'HTML 가계도' 탐색하기</h1>
    <pre>
        우리는 querySelector로 특정 요소를 찾은 뒤, 그 요소를 기준으로
        가족(부모, 자식, 형제) 요소를 찾아 나갈 수 있습니다.

        이때, 눈에 보이지 않는 '공백'이나 '줄바꿈' (텍스트 노드) 때문에 겪는 혼란을 피하기 위해
        요소만 필요한 경우에는 이름에 `Element`가 들어간 탐색 프로  퍼티를 사용합니다.
        </pre>

    <ul id="family">
        <!-- 이 주석과 줄바꿈도 노드입니다! -->
        <li id="me">나 (기준)</li>
        <li>나의 첫째 형제</li>
        <li>나의 둘째 형제</li>
    </ul>

    <script>
        const $me = document.getElementById('me');

        const $family = document.getElementById('family')
        //childnides : 모든 '자식요소 ' 들을 nodelist로 반환 (공백/텍스트/주석노드포힘)
        console.log($family.childNodes)

        console.log('===자식요소탐색===');
        //children : 모든 '자식 요소' 들을 htmlcollection으로 반환 (텍스트 노드 제외)
        const $childeren = $family.children;
        console.log($childeren);


        // firstElementchild : 첫 번쨰 '자식 요소' 반환
        const $first = $family.firstElementChild;
        console.log($first);
        $first.style.color = 'red';

        //lastElementChild :마지막 '자식 요소' 반환
        const $last = $family.lastElementChild;
        console.log($last)

        console.log('/n=== 부모 요소 탐색')
        //parentNode : 나의 '부모 노드' 반환
        //HTML 요소를 기준으로 다룰 때는 parentElemnt 도 자주 사용

        const $parent = $me.parentNode;
        console.log($parent)
        $parent.style.border = '1px solid blue';

        console.log('===형제 요소 탐색');
        //nextElemenstSibling : 나의 바로 다음 '형제 요소' 반환
        const $next = $me.nextElementSibling;
        console.log($next)

        //previousElemnetSibling : 나의 바로 이전 '형제요소' 반환
        const $prev = $next.previousElementSibling 
        console.log($prev);

</script>
</body>
</html>
